query MemoryListStores($first: Int!, $after: String, $query: String) {
  memoryStores(first: $first, after: $after, query: $query) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ...MemoryStoreDetails
      }
    }
  }
}

query MemoryListInteractionProfiles($first: Int!, $after: String, $query: String) {
  memoryInteractionProfiles(first: $first, after: $after, query: $query) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ...MemoryInteractionProfileDetails
      }
    }
  }
}

query MemoryFindEmbeddingProfiles($first: Int!, $after: String, $query: String) {
  embeddingProfileSummaries(first: $first, after: $after, query: $query) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        name
        providerName
      }
    }
  }
}

query MemoryFindModelProfiles($first: Int!, $after: String, $query: String) {

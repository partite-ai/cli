mutation MemoryCreateScope($memoryStoreID: MemoryStoreID!, $input: NewMemoryStoreScope!) {
  # @genqlient(flatten: true)
  createMemoryStoreScope(memoryStoreID: $memoryStoreID, input: $input) {
    ...MemoryStoreScopeDetails
  }
}

mutation MemoryUpdateScope($id: MemoryStoreScopeID!, $input: UpdateMemoryStoreScope!) {
  # @genqlient(flatten: true)
  updateMemoryStoreScope(id: $id, input: $input) {
    ...MemoryStoreScopeDetails
  }
}

mutation MemoryDeleteScopes($ids: [MemoryStoreScopeID!]!) {
  deleteMemoryStoreScopes(memoryStoreScopeIDs: $ids) {
    ids
  }
}

# @genqlient(typename: "MemoryTagDetails")
fragment MemoryTagDetails on MemoryTag {
  key
  value
}

# @genqlient(typename: "MemoryDocumentDetails")
fragment MemoryDocumentDetails on MemoryDocument {
  id
  externalID
  mediaType
  time
  ingestedAt
  conversationID
  sequence
  speaker {
    name
    role
  }
  tags {
    ...MemoryTagDetails
  }
  preview
  previewTruncated
}

# @genqlient(typename: "MemoryChunkDetails")
fragment MemoryChunkDetails on MemoryChunk {
  id
  documentID
  index
  text
  sequence
  time
  tags {
    ...MemoryTagDetails
  }
}

# @genqlient(typename: "MemoryFactDetails")
fragment MemoryFactDetails on MemoryFact {
  id
  text
  class
  origin
  state
  mergedIntoID
  mergedReason
  observedAt
  periodStart
  periodEnd
  chunkID
  scopeID
  tags {
    ...MemoryTagDetails
  }
  entityIDs
}

# @genqlient(typename: "MemoryObservationDetails")
fragment MemoryObservationDetails on MemoryObservation {
  id
  text
  topic
  class
  scopeID
  scopeTag {
    ...MemoryTagDetails
  }
  factIDs
  periodStart
  periodEnd
  updatedAt
  saidAt
}

query MemoryListDocuments(
  $memoryStoreID: MemoryStoreID!
  $first: Int!
  $after: String
  $orderBy: MemoryDocumentOrderBy!
  $order: Order!
  $query: String
  $conversationID: String
  $tag: MemoryTagInput
) {
  memoryDocuments(
    memoryStoreID: $memoryStoreID
    first: $first
    after: $after
    order_by: $orderBy
    order: $order
    query: $query
    conversationID: $conversationID
    tag: $tag
  ) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ...MemoryDocumentDetails
      }
    }
  }
}

query MemoryGetDocument($memoryStoreID: MemoryStoreID!, $id: ID!) {
  memoryDocument(memoryStoreID: $memoryStoreID, id: $id) {
    ...MemoryDocumentDetails
  }
}

query MemoryListChunks($memoryStoreID: MemoryStoreID!, $documentID: ID!, $first: Int!, $after: String) {
  memoryDocumentChunks(memoryStoreID: $memoryStoreID, documentID: $documentID, first: $first, after: $after) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ...MemoryChunkDetails
      }
    }
  }
}

query MemoryGetChunk($memoryStoreID: MemoryStoreID!, $id: ID!) {
  memoryChunk(memoryStoreID: $memoryStoreID, id: $id) {
    ...MemoryChunkDetails
  }
}


# @genqlient(typename: "MemoryRecallRecordDetails")
fragment MemoryRecallRecordDetails on MemoryRecallRecord {
  id
  type
  text
  topic
  score
  tokens
  textRank
  meaningRank
  textScore
  meaningScore
  recent
  factCount
  tags {
    ...MemoryTagDetails
  }
}

query MemoryRecall(
  $memoryStoreID: MemoryStoreID!
  $query: String
  $conversationID: String
  $recordTypes: [MemoryRecordType!]
  $tag: MemoryTagInput
  $budget: Int!
  $omitSources: Boolean!
  $minSimilarity: Float
) {
  memoryRecall(
    memoryStoreID: $memoryStoreID
    query: $query
    conversationID: $conversationID
    recordTypes: $recordTypes
    tag: $tag
    budget: $budget
    omitSources: $omitSources
    minSimilarity: $minSimilarity
  ) {
    weighed
    budget
    spent
    depth
    textFound
    meaningFound
    minSimilarity
    embedError
    took {
      total
      embed
      meaning
      text
      read
    }
    records {
      ...MemoryRecallRecordDetails
    }
    dropped {
      ...MemoryRecallRecordDetails
    }
  }
}

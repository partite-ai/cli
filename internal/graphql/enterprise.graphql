# ---------------------------------------------------------------------------
# Evaluations and evaluation trace runs.
# ---------------------------------------------------------------------------

# @genqlient(typename: "EnterpriseEvaluationSummary")
fragment EnterpriseEvaluationSummary on Evaluation {
  id
  traceRequestID
  meshID
  meshName
  meshVersionID
  meshOrdinal
  rubricID
  rubricName
  modelSetID
  modelSetName
  monitorID
  traceRunID
  status
  rubricScore
  createdAt
}

# @genqlient(typename: "EnterpriseEvaluationResult")
fragment EnterpriseEvaluationResult on EvaluationResult {
  rubricMetricType
  rubricMetricID
  metricName
  category
  trialCount
  score
  rawValue
  unit
  measurementStatus
  measurementReason
  label
  feedback
  error
}

query EnterpriseListEvaluations($filter: EvaluationsFilter, $first: Int!, $after: Time) {
  evaluations(filter: $filter, first: $first, after: $after, order: DESC) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      # @genqlient(flatten: true)
      node {
        ...EnterpriseEvaluationSummary
      }
    }
  }
}

query EnterpriseGetEvaluation($id: EvalID!) {
  evaluation(id: $id) {
    ...EnterpriseEvaluationSummary
    results {
      ...EnterpriseEvaluationResult
    }
  }
}

mutation EnterpriseDeleteEvaluations($ids: [EvalID!]!) {
  deleteEvaluations(ids: $ids) {
    ids
  }
}

# @genqlient(typename: "EnterpriseTraceRun")
fragment EnterpriseTraceRun on EvaluationTraceRun {
  id
  traceID
  scope
  meshID
  meshVersionID
  rubricID
  modelSetID
  status
  evaluationCount
  completedCount
  erroredCount
  pendingCount
  rubricScore
  metricScores {
    metricName
    rubricMetricType
    category
    meanScore
    scoredEvaluationCount
  }
  startedAt
  completedAt
  createdAt
}

query EnterpriseListTraceRuns($filter: EvaluationTraceRunsFilter, $first: Int!, $after: Time) {
  evaluationTraceRuns(filter: $filter, first: $first, after: $after) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      # @genqlient(flatten: true)
      node {
        ...EnterpriseTraceRun
      }
    }
  }
}

query EnterpriseGetTraceRun($id: EvalTraceRunID!) {
  # @genqlient(flatten: true)
  evaluationTraceRun(id: $id) {
    ...EnterpriseTraceRun
  }
}

mutation EnterpriseDeleteTraceRuns($ids: [EvalTraceRunID!]!) {
  deleteEvaluationTraceRuns(ids: $ids) {
    ids
  }
}

# ---------------------------------------------------------------------------
# Evaluation reports.
# ---------------------------------------------------------------------------

query EnterpriseEvaluationReportRubrics($input: EvaluationReportRangeInput!) {
  evaluationReportRubrics(input: $input) {
    rubricID
    name
    description
    selectedRequestCount
  }
}

# @genqlient(typename: "EnterpriseReportAggregate")
fragment EnterpriseReportAggregate on EvaluationReportAggregate {
  totalRequestCount
  selectedRequestCount
  successfulRequestCount
  latestPendingRequestCount
  latestFailedRequestCount
  coverageRatio
  rubricScore
  metrics {
    rubricMetricID
    value
    score
    contributingRequestCount
  }
}

query EnterpriseEvaluationReport($input: EvaluationReportInput!) {
  evaluationReport(input: $input) {
    meshID
    rubricID
    startTime
    endTime
    interval
    metrics {
      rubricMetricID
      type
      name
      category
      unit
      aggregation
      weight
    }
    versions {
      meshVersionID
      ordinal
      label
      summary {
        ...EnterpriseReportAggregate
      }
      points {
        startTime
        endTime
        aggregate {
          ...EnterpriseReportAggregate
        }
      }
    }
  }
}

# ---------------------------------------------------------------------------
# Schedules.
# ---------------------------------------------------------------------------

# @genqlient(typename: "EnterpriseSchedule")
fragment EnterpriseSchedule on Schedule {
  id
  name
  description
  mesh {
    id
    name
  }
  meshVersionLabel
  route {
    id
    name
  }
  inputName
  input
  conversationTags
  notificationChannelID
  cronExpression
  enabled
  nextRunAt
  lastRunAt
  lastRunConversationID
  lastRunError
  createdAt
  updatedAt
}

query EnterpriseListSchedules($first: Int!, $after: String, $query: String) {
  schedules(first: $first, after: $after, query: $query) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      # @genqlient(flatten: true)
      node {
        ...EnterpriseSchedule
      }
    }
  }
}

query EnterpriseGetSchedule($id: ScheduleID!) {
  # @genqlient(flatten: true)
  schedule(id: $id) {
    ...EnterpriseSchedule
  }
}

mutation EnterpriseCreateSchedule($input: NewSchedule!) {
  # @genqlient(flatten: true)
  createSchedule(input: $input) {
    ...EnterpriseSchedule
  }
}

mutation EnterpriseModifySchedule($id: ScheduleID!, $input: UpdateSchedule!) {
  # @genqlient(flatten: true)
  updateSchedule(id: $id, input: $input) {
    ...EnterpriseSchedule
  }
}

mutation EnterpriseDeleteSchedules($ids: [ScheduleID!]!) {
  deleteSchedules(scheduleIDs: $ids) {
    ids
  }
}

query EnterpriseCronNextRun($cronExpression: String!) {
  cronNextRun(cronExpression: $cronExpression)
}

# Operations for the enterprise-only eval and schedule commands. Names start
# with Enterprise so they do not clash with other groups.

# ---------------------------------------------------------------------------
# Lookups by name for references in flags and spec files.
# ---------------------------------------------------------------------------

query EnterpriseFindMeshes($first: Int!, $after: String, $query: String) {
  meshes(first: $first, after: $after, query: $query) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        name
      }
    }
  }
}

query EnterpriseFindModelSets($first: Int!, $after: String, $query: String) {
  modelSets(first: $first, after: $after, query: $query) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        name
      }
    }
  }
}

query EnterpriseFindRoutes($meshID: MeshID, $first: Int!, $after: String, $query: String) {
  routes(meshID: $meshID, first: $first, after: $after, query: $query) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        name
      }
    }
  }
}

# ---------------------------------------------------------------------------
# Judge and computed metrics.
# ---------------------------------------------------------------------------

query EnterpriseListJudgeMetrics($first: Int!, $after: String, $query: String) {
  metrics(type: JUDGED, first: $first, after: $after, query: $query) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ... on JudgeMetric {
          ...JudgeMetricDetails
        }
      }
    }
  }
}

query EnterpriseListComputedMetrics($first: Int!, $after: String) {
  metrics(type: COMPUTED, first: $first, after: $after) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ... on ComputedMetric {
          ...ComputedMetricDetails
        }
      }
    }
  }
}

mutation EnterpriseDeleteJudgeMetrics($ids: [JudgeMetricID!]!) {
  deleteJudgeMetrics(ids: $ids) {
    ids
  }
}

# ---------------------------------------------------------------------------
# Rubrics. Like RubricDetails, with the metric names for people.
# ---------------------------------------------------------------------------

# @genqlient(typename: "EnterpriseRubric")
fragment EnterpriseRubric on Rubric {
  id
  name
  description
  createdAt
  updatedAt
  metrics {
    __typename
    ... on RubricJudgeMetric {
      judgeEntryID: id
      judgeMetric {
        id
        name
      }
      trialCount
      complexity
      inputValues
      judgeWeight: weight
    }
    ... on RubricComputedMetric {
      computedEntryID: id
      computedMetric {
        key
        name
      }
      scoreFloor
      scoreCeiling
      lowerIsBetter
      computedWeight: weight
    }
  }
}

query EnterpriseListRubrics($first: Int!, $after: String, $query: String) {
  rubrics(first: $first, after: $after, query: $query) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      # @genqlient(flatten: true)
      node {
        ...EnterpriseRubric
      }
    }
  }
}

query EnterpriseGetRubric($id: RubricID!) {
  # @genqlient(flatten: true)
  rubric(id: $id) {
    ...EnterpriseRubric
  }
}

mutation EnterpriseCreateRubric($input: NewRubric!) {
  # @genqlient(flatten: true)
  createRubric(input: $input) {
    ...EnterpriseRubric
  }
}

mutation EnterpriseModifyRubric($id: RubricID!, $input: UpdateRubric!) {
  # @genqlient(flatten: true)
  updateRubric(id: $id, input: $input) {
    ...EnterpriseRubric
  }
}

mutation EnterpriseDeleteRubrics($ids: [RubricID!]!) {
  deleteRubrics(ids: $ids) {
    ids
  }
}


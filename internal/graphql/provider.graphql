# @genqlient(typename: "ScoreExampleDetails")
fragment ScoreExampleDetails on ScoreExample {
  rating
  scenario
  judgment
}

# @genqlient(typename: "JudgeInputFieldDetails")
fragment JudgeInputFieldDetails on JudgeInputField {
  name
  label
  description
  type
  required
}

# @genqlient(typename: "JudgeMetricDetails")
fragment JudgeMetricDetails on JudgeMetric {
  id
  name
  description
  category
  scope
  prompt
  complexity
  examples {
    ...ScoreExampleDetails
  }
  inputFields {
    ...JudgeInputFieldDetails
  }
  createdAt
  updatedAt
}

query GetJudgeMetric($id: JudgeMetricID!) {
  # @genqlient(flatten: true)
  judgeMetric(id: $id) {
    ...JudgeMetricDetails
  }
}

# The API finds metrics by text, not by name, so a lookup by name searches and
# keeps the exact match.
query SearchJudgeMetrics($query: String!, $first: Int!, $after: String) {
  metrics(type: JUDGED, query: $query, first: $first, after: $after) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ... on JudgeMetric {
          ...JudgeMetricDetails
        }
      }
    }
  }
}

mutation CreateJudgeMetric($input: NewJudgeMetric!) {
  # @genqlient(flatten: true)
  createJudgeMetric(input: $input) {
    ...JudgeMetricDetails
  }
}

mutation ModifyJudgeMetric($id: JudgeMetricID!, $input: UpdateJudgeMetric!) {
  # @genqlient(flatten: true)
  updateJudgeMetric(id: $id, input: $input) {
    ...JudgeMetricDetails
  }
}

mutation DeleteJudgeMetric($id: JudgeMetricID!) {
  deleteJudgeMetrics(ids: [$id]) {
    ids
  }
}

# @genqlient(typename: "ComputedMetricDetails")
fragment ComputedMetricDetails on ComputedMetric {
  key
  name
  description
  category
  collectionScope
  summarySource
  aggregation
  unit
}

query GetComputedMetric($key: String!) {
  # @genqlient(flatten: true)
  computedMetric(key: $key) {
    ...ComputedMetricDetails
  }
}

# @genqlient(typename: "RubricDetails")
fragment RubricDetails on Rubric {
  id
  name
  description
  createdAt
  updatedAt
  metrics {
    __typename
    # The two members give their entry ids different types, so each needs an
    # alias of its own.
    ... on RubricJudgeMetric {
      judgeEntryID: id
      judgeMetric {
        id
      }
      trialCount
      complexity
      inputValues
      judgeWeight: weight
    }
    ... on RubricComputedMetric {
      computedEntryID: id
      computedMetric {
        key
      }
      scoreFloor
      scoreCeiling
      lowerIsBetter
      computedWeight: weight
    }
  }
}

query GetRubric($id: RubricID!) {
  # @genqlient(flatten: true)
  rubric(id: $id) {
    ...RubricDetails
  }
}

mutation CreateRubric($input: NewRubric!) {
  # @genqlient(flatten: true)
  createRubric(input: $input) {
    ...RubricDetails
  }
}

mutation ModifyRubric($id: RubricID!, $input: UpdateRubric!) {
  # @genqlient(flatten: true)
  updateRubric(id: $id, input: $input) {
    ...RubricDetails
  }
}

mutation DeleteRubric($id: RubricID!) {
  deleteRubrics(ids: [$id]) {
    ids
  }
}


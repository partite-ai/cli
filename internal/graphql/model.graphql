mutation ModelProbeEmbeddingProfile(
  $credentials: ModelProviderCredentials!
  $configuration: EmbeddingProfileConfigInput!
) {
  probeEmbeddingProfile(credentials: $credentials, configuration: $configuration) {
    outcome
    message
  }
}

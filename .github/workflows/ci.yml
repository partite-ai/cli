name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: 'off'
  GOFLAGS: '-mod=readonly'
  PARTITE_NO_KEYRING: '1'

jobs:
  test:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
            binary: partite
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            binary: partite
          - runner: macos-15-intel
            target: darwin-amd64
            binary: partite
          - runner: macos-15
            target: darwin-arm64
            binary: partite
          - runner: windows-2025
            target: windows-amd64
            binary: partite.exe
          - runner: windows-11-arm
            target: windows-arm64
            binary: partite.exe
    defaults:
      run:
        shell: bash
    env:
      BINARY_NAME: ${{ matrix.binary }}
      ARCHIVE_NAME: partite-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build CLI
        run: |
          version="dev-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/partite-ai/partite-cli/internal/cmdutil.Version=$version" -o "dist/$BINARY_NAME" ./cmd/partite
      - name: Check CLI startup
        run: |
          "./dist/$BINARY_NAME" --version
          "./dist/$BINARY_NAME" --help
      - name: Package Linux and macOS
        if: runner.os != 'Windows'
        run: tar -czf "dist/$ARCHIVE_NAME.tar.gz" -C dist "$BINARY_NAME" -C "$GITHUB_WORKSPACE" README.md
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:BINARY_NAME", README.md -DestinationPath "dist/$env:ARCHIVE_NAME.zip"
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: partite-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download build archives
        uses: actions/download-artifact@v8
        with:
          pattern: partite-*
          merge-multiple: true
          path: dist
      - name: Verify archives and write checksums
        shell: bash
        working-directory: dist
        run: |
          archives=(
            partite-linux-amd64.tar.gz
            partite-linux-arm64.tar.gz
            partite-darwin-amd64.tar.gz
            partite-darwin-arm64.tar.gz
            partite-windows-amd64.zip
            partite-windows-arm64.zip
          )
          for archive in "${archives[@]}"; do
            test -s "$archive"
          done
          sha256sum "${archives[@]}" > checksums.txt
      - name: Publish GitHub Release
        shell: bash
        run: |
          release_flags=(--latest)
          create_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags=(--latest=false)
            create_flags=(--prerelease)
          fi

          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == "false" ]]; then
              echo "Release $RELEASE_TAG is already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes "${create_flags[@]}"
          fi

          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${release_flags[@]}"
